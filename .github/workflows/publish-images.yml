name: Publish container images

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref, tag, or SHA to build
        required: true
        type: string
      image_tag:
        description: Primary OCI tag
        required: true
        type: string
      publish_latest:
        description: Also update the latest tag
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref, tag, or SHA to build
        required: true
        default: main
        type: string
      image_tag:
        description: Primary OCI tag
        required: true
        default: edge
        type: string
      publish_latest:
        description: Also update the latest tag
        required: true
        default: false
        type: boolean

permissions: {}

concurrency:
  group: publish-images-${{ inputs.image_tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.component }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: API
            image_suffix: api
            context: ./apps/api
            dockerfile: ./apps/api/Dockerfile
          - component: Web
            image_suffix: web
            context: .
            dockerfile: ./apps/web/Dockerfile
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Resolve lowercase image name
        id: image
        shell: bash
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}-${{ matrix.image_suffix }}
        run: echo "name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Generate OCI metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ inputs.image_tag }}
            type=raw,value=latest,enable=${{ inputs.publish_latest }}
            type=sha,format=long,prefix=sha-
          labels: |
            org.opencontainers.image.title=Matinê ${{ matrix.component }}
            org.opencontainers.image.description=Privacy-first movie platform ${{ matrix.component }}

      - name: Build and publish
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}
          cache-from: type=gha,scope=${{ matrix.image_suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image_suffix }}
          provenance: mode=max
          sbom: true

      - name: Attest public image provenance
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
